[project]
name = "internship-feed"
version = "0.1.0"
description = "One normalised list of software internship openings, fetched via String Web Access."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
internship-feed = "feed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
